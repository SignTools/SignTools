name: Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch Bun version
        run: |
          BUN_VERSION=$(perl -ne 'print "$1\n" if /FROM .*oven\/bun:([0-9.]+)/' Dockerfile | head -n1)
          [ -n "$BUN_VERSION" ] || exit 1
          echo "bun_version=$BUN_VERSION" >> "$GITHUB_ENV"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "${{ env.bun_version }}"

      - name: Install web dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bun fmt --check

      - name: Type check
        run: bun check

      - name: Build web files
        run: bun run build

      - name: Fetch Go version
        run: |
          GO_VERSION=$(perl -ne 'print "$1\n" if /FROM golang:([0-9.]+)/' Dockerfile | head -n1)
          [ -n "$GO_VERSION" ] || exit 1
          echo "go_version=$GO_VERSION" >> $GITHUB_ENV

      - name: Setup Go environment
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "${{ env.go_version }}"

      - name: Program Test
        run: go test ./...

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Docker Build Test
        run: docker buildx build --load --tag test:test --file ./Dockerfile ./
